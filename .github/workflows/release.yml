name: Release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for npm trusted publishing (OIDC). Without this the runner
      # cannot mint an OIDC token and pnpm falls back to NODE_AUTH_TOKEN.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 11
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org/"

      # The platform packages in optionalDependencies are published *by this
      # workflow*, so they cannot resolve yet: the lockfile can never be in
      # sync (--frozen-lockfile is on by default in CI) and the root
      # postinstall would fail trying to link a binary that does not exist.
      # Only the devDependencies are needed to run prepare.js.
      - run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm check

      - name: Prepare platforms
        run: node scripts/prepare.js

      # Auth comes from the OIDC token minted above; no npm token is needed
      # once a trusted publisher is configured for all 8 packages. NODE_AUTH_TOKEN
      # is kept only for the *initial* publish of a package that does not exist
      # on npm yet, since a trusted publisher cannot be configured until then
      # (npm/cli#8544). It is ignored when OIDC is available, so it is safe to
      # leave in place — or drop it once every package is bootstrapped.
      - name: Publish packages
        run: node scripts/publish.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance is documented as automatic under trusted publishing, but
          # pnpm has historically needed it stated explicitly. Set here rather
          # than in publish.js so local --dry-run runs (no OIDC) still work.
          NPM_CONFIG_PROVENANCE: "true"
