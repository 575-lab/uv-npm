name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack everything without publishing to npm"
        required: false
        default: true
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    # NPM_TOKEN is stored as an *environment* secret, so the job has to opt into
    # the environment or secrets.NPM_TOKEN silently resolves to an empty string.
    # This name must also match the "Environment" field of the npm trusted
    # publisher: declaring an environment adds it to the OIDC token's subject
    # claim, and npm rejects the token if the two disagree.
    environment: npm
    permissions:
      # Required for npm trusted publishing (OIDC). Without this the runner
      # cannot mint an OIDC token and pnpm falls back to NODE_AUTH_TOKEN.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 11
          run_install: false

      # No registry-url on purpose. With it set, setup-node writes
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc; now
      # that NPM_TOKEN is gone that expands to an empty value, npm sees auth as
      # "already configured" and never starts the OIDC exchange
      # (actions/setup-node#1440). The registry is already pinned by
      # publishConfig.registry in the root manifest and in every generated
      # platform manifest, so nothing here needs to set it.
      # v7 also drops the dummy NODE_AUTH_TOKEN export (actions/setup-node#1558);
      # v5 still exports it.
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      # The platform packages in optionalDependencies are published *by this
      # workflow*, so they cannot resolve yet: the lockfile can never be in
      # sync (--frozen-lockfile is on by default in CI) and the root
      # postinstall would fail trying to link a binary that does not exist.
      # Only the devDependencies are needed to run prepare.js.
      - run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm check

      - name: Prepare platforms
        run: node scripts/prepare.js

      # Auth is the OIDC token minted from the id-token permission above; all 8
      # packages have a trusted publisher configured, so no npm token exists or
      # is referenced here. Do not reintroduce NODE_AUTH_TOKEN: setting it to a
      # deleted secret yields an empty string, which suppresses the OIDC
      # exchange rather than falling back to it.
      - name: Publish packages
        run: node scripts/publish.js ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          # Provenance is documented as automatic under trusted publishing, but
          # the token-authenticated bootstrap publish of 0.12.0 produced no
          # attestation, so it is stated explicitly. Set here rather than in
          # publish.js so local --dry-run runs (no OIDC) still work.
          NPM_CONFIG_PROVENANCE: "true"
